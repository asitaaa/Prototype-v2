=75\" alt=\"A quiet, curving residential street lined with trees in the late-afternoon sun\" fetchpriority=\"high\">\n</div>\n<div class=\"hero-shade\"></div>\n<div class=\"hero-grid gap-40\">\n<div class=\"hero-copy flex-column gap-24\">\n<p class=\"sub-title subtitle-on-dark\">Cypress &amp; north Orange County</p>\n<h1 id=\"hero-title\" class=\"title-1 heading-on-dark\">One agent, from the first coffee to the closing</h1>\n<p class=\"body-l\">We're a small Cypress agency that helps homeowners sell. We take on fewer clients, so every seller gets someone who knows their street and stays with them all the way.</p>\n<div class=\"flex-row flex-wrap flex-align-center gap-24\">\n<a class=\"btn-solid\" href=\"#valuation\">Ask what your home is worth <svg class=\"icon icon-arrow\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M5 12h14M13 6l6 6-6 6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></a>\n<a class=\"text-link link-on-dark\" href=\"#homes\">Or see homes for sale</a>\n</div>\n</div>\n<figure class=\"hero-quote card pad-24 flex-column gap-16 shadow-l\">\n<blockquote class=\"body-m body-on-light\">\n<p>\"I left a big firm because clients were passed around. We take on fewer clients so we can really guide them.\"</p>\n</blockquote>\n<figcaption class=\"flex-row flex-align-center gap-12\">\n<img class=\"avatar-m\" src=\"https://images.unsplash.com/photo-1580489944761-15a19d654956?auto=format&fit=crop&w=160&h=160&q=75\" alt=\"Claire Morgan (placeholder photo)\">\n<span class=\"flex-column\">\n<span class=\"body-m heading-on-light\"><strong>Claire Morgan</strong></span>\n<span class=\"body-s detail-on-light\">Founder &amp; managing director</span>\n</span>\n</figcaption>\n</figure>\n</div>\n</section>\n<section data-header=\"light\" class=\"bg-light-1 boxed-l pad-tb-48\" aria-label=\"Larkline in numbers\">\n<ul class=\"facts-grid gap-32\">\n<li class=\"flex-column gap-4\">\n<span class=\"fact-number title-3\" data-count>9 years</span>\n<span class=\"body-s detail-on-light\">Selling homes from our office on Lincoln Avenue</span>\n</li>\n<li class=\"flex-column gap-4\">\n<span class=\"fact-number title-3\" data-count>1 agent</span>\n<span class=\"body-s detail-on-light\">Stays with you from the first call to the keys</span>\n</li>\n<li class=\"flex-column gap-4\">\n<span class=\"fact-number title-3\" data-count>4 agents</span>\n<span class=\"body-s detail-on-light\">Each covers the three cities they know best</span>\n</li>\n<li class=\"flex-column gap-4\">\n<span class=\"fact-number title-3\">Sales only</span>\n<span class=\"body-s detail-on-light\">No rentals, so selling and buying get our full attention</span>\n</li>\n</ul>\n</section>\n<section id=\"selling\" data-header=\"dark\" class=\"bg-dark-1 boxed-l pad-tb-128 body-on-dark\" aria-labelledby=\"selling-title\">\n<div class=\"split-grid gap-40\">\n<div class=\"flex-column gap-40\">\n<div class=\"flex-column gap-20\">\n<p class=\"sub-title subtitle-on-dark\">Selling with Larkline</p>\n<h2 id=\"selling-title\" class=\"title-2 heading-on-dark\">Find out what your home is worth from someone who knows your street</h2>\n</div>\n<ol class=\"steps flex-column gap-32\">\n<li class=\"step gap-16 reveal\">\n<span class=\"step-number\" aria-hidden=\"true\">1</span>\n<div class=\"flex-column gap-8\">\n<h3 class=\"title-5 heading-on-dark\">Tell us about your home</h3>\n<p class=\"body-m\">Three short steps, about two minutes. No obligation and no newsletter.</p>\n</div>\n</li>\n<li class=\"step gap-16 reveal\">\n<span class=\"step-number\" aria-hidden=\"true\">2</span>\n<div class=\"flex-column gap-8\">\n<h3 class=\"title-5 heading-on-dark\">Meet the agent for your area</h3>\n<p class=\"body-m\">They walk through the home with you and price it on what's actually sold nearby.</p>\n</div>\n</li>\n<li class=\"step gap-16 reveal\">\n<span class=\"step-number\" aria-hidden=\"true\">3</span>\n<div class=\"flex-column gap-8\">\n<h3 class=\"title-5 heading-on-dark\">Sell with one person beside you</h3>\n<p class=\"body-m\">The same agent handles photos, viewings, offers and closing. You always know who to call.</p>\n</div>\n</li>\n</ol>\n<figure class=\"placeholder-note pad-24 flex-column gap-12\">\n<p class=\"sub-title subtitle-on-dark\">Client quote needed</p>\n<blockquote class=\"body-m\">\n<p>A short quote from a recent Cypress seller goes here, in their own words, with first name and street.</p>\n</blockquote>\n</figure>\n</div>\n<form id=\"valuation\" class=\"valuation-form card pad-32 flex-column gap-24 shadow-l\" data-step=\"1\" novalidate aria-labelledby=\"form-title\">\n<div class=\"form-progress-wrap flex-column gap-12\">\n<div class=\"flex-row flex-justify-between flex-align-center gap-12\">\n<h3 id=\"form-title\" class=\"title-5 heading-on-light\">Free home valuation</h3>\n<span class=\"body-s detail-on-light\" data-step-label>Step 1 of 3</span>\n</div>\n<div class=\"form-progress gap-8\" aria-hidden=\"true\">\n<span class=\"progress-step\"></span><span class=\"progress-step\"></span><span class=\"progress-step\"></span>\n</div>\n</div>\n<fieldset class=\"form-step gap-20\" data-for=\"1\">\n<legend class=\"body-m body-on-light pad-tb-8\">Where is the home?</legend>\n<div class=\"field-group gap-8\">\n<label class=\"field-label\" for=\"f-street\">Street address</label>\n<input class=\"field\" id=\"f-street\" name=\"street\" autocomplete=\"street-address\" placeholder=\"e.g. 5432 Orange Ave\" required>\n<p class=\"field-error\" id=\"e-street\" hidden>Add the street address so we know which home it is.</p>\n</div>\n<div class=\"field-row gap-16\">\n<div class=\"field-group gap-8\">\n<label class=\"field-label\" for=\"f-city\">City</label>\n<select class=\"field\" id=\"f-city\" name=\"city\" required>\n<option value=\"\">Choose a city</option>\n<option>Cypress</option><option>La Palma</option><option>Buena Park</option>\n<option>Los Alamitos</option><option>Rossmoor</option><option>Seal Beach</option>\n<option>Garden Grove</option><option>Stanton</option><option>Anaheim</option>\n<option>Huntington Beach</option><option>Fountain Valley</option><option>Westminster</option>\n</select>\n<p class=\"field-error\" id=\"e-city\" hidden>Choose the city.</p>\n</div>\n<div class=\"field-group gap-8\">\n<label class=\"field-label\" for=\"f-zip\">ZIP code</label>\n<input class=\"field\" id=\"f-zip\" name=\"zip\" inputmode=\"numeric\" autocomplete=\"postal-code\" placeholder=\"90630\">\n</div>\n</div>\n</fieldset>\n<fieldset class=\"form-step gap-20\" data-for=\"2\">\n<legend class=\"body-m body-on-light pad-tb-8\">About the home</legend>\n<div class=\"field-group gap-8\">\n<span class=\"field-label\" id=\"l-type\">Type of home</span>\n<div class=\"choice-group gap-8\" role=\"radiogroup\" aria-labelledby=\"l-type\">\n<label class=\"choice\"><input type=\"radio\" name=\"type\" value=\"house\" checked>House</label>\n<label class=\"choice\"><input type=\"radio\" name=\"type\" value=\"townhome\">Townhome</label>\n<label class=\"choice\"><input type=\"radio\" name=\"type\" value=\"condo\">Condo</label>\n</div>\n</div>\n<div class=\"field-row gap-16\">\n<div class=\"field-group gap-8\">\n<label class=\"field-label\" for=\"f-beds\">Bedrooms</label>\n<select class=\"field\" id=\"f-beds\" name=\"beds\"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5+</option></select>\n</div>\n<div class=\"field-group gap-8\">\n<label class=\"field-label\" for=\"f-when\">When would you like to sell?</label>\n<select class=\"field\" id=\"f-when\" name=\"when\"><option>Just curious</option><option>Within 3 months</option><option>3 to 12 months</option><option>Later than that</option></select>\n</div>\n</div>\n</fieldset>\n<fieldset class=\"form-step gap-20\" data-for=\"3\">\n<legend class=\"body-m body-on-light pad-tb-8\">Who should we call?</legend>\n<div class=\"field-group gap-8\">\n<label class=\"field-label\" for=\"f-name\">Your name</label>\n<input class=\"field\" id=\"f-name\" name=\"name\" autocomplete=\"name\" required>\n<p class=\"field-error\" id=\"e-name\" hidden>Add your name so your agent knows who to ask for.</p>\n</div>\n<div class=\"field-row gap-16\">\n<div class=\"field-group gap-8\">\n<label class=\"field-label\" for=\"f-phone\">Phone</label>\n<input class=\"field\" id=\"f-phone\" name=\"phone\" type=\"tel\" autocomplete=\"tel\" required>\n<p class=\"field-error\" id=\"e-phone\" hidden>Add a phone number.</p>\n</div>\n<div class=\"field-group gap-8\">\n<label class=\"field-label\" for=\"f-email\">Email</label>\n<input class=\"field\" id=\"f-email\" name=\"email\" type=\"email\" autocomplete=\"email\" required>\n<p class=\"field-error\" id=\"e-email\" hidden>Check the email address.</p>\n</div>\n</div>\n</fieldset>\n<div class=\"form-step gap-16\" data-for=\"done\" role=\"status\">\n<span class=\"done-mark\"><svg class=\"icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M5 12.5l4.5 4.5L19 7.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></span>\n<h3 class=\"title-4 heading-on-light\">Thanks, we've got it</h3>\n<p class=\"body-m body-on-light\">Your request goes straight to the agent for your area, who will call you to set up a visit. Dana checks that every request gets an answer.</p>\n<p class=\"body-s detail-on-light\">Prefer to talk now? Call the office on <a class=\"text-link link-on-light\" href=\"tel:+17145550100\">714-555-0100</a>.</p>\n</div>\n<div class=\"form-nav flex-row flex-justify-between flex-align-center gap-12\" data-form-nav>\n<button class=\"btn-plain\" type=\"button\" data-back hidden>Back</button>\n<span></span>\n<button class=\"btn-solid\" type=\"submit\" data-next>Next <svg class=\"icon icon-arrow\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M5 12h14M13 6l6 6-6 6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoi (function (root) {
  var els = Array.prototype.slice.call(root.querySelectorAll("[data-count]"));
  if (!els.length || !("IntersectionObserver" in window)) return;
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var re = /^([^\d-]*)(-?\d[\d,]*(?:\.\d+)?)([\s\S]*)$/;
  var DURATION = 1600, STAGGER = 150;
  var items = [];
  els.forEach(function (el) {
    var text = el.textContent.trim();
    var m = text.match(re);
    if (!m) return;
    var num = m[2];
    items.push({
      el: el, text: text, html: el.innerHTML, prefix: m[1], suffix: m[3],
      target: parseFloat(num.replace(/,/g, "")),
      decimals: num.indexOf(".") < 0 ? 0 : num.split(".")[1].length,
      grouped: num.indexOf(",") >= 0,
      state: "idle", value: null
    });
  });
  function format(item, v) {
    return v.toLocaleString("en-US", { minimumFractionDigits: item.decimals, maximumFractionDigits: item.decimals, useGrouping: item.grouped });
  }
  function prime(item) {
    if (item.state !== "idle") return;
    item.state = "primed";
    item.el.setAttribute("aria-label", item.text);
    var wrap = document.createElement("span");
    wrap.setAttribute("aria-hidden", "true");
    item.value = document.createElement("span");
    item.value.textContent = format(item, 0);
    wrap.appendChild(document.createTextNode(item.prefix));
    wrap.appendChild(item.value);
    wrap.appendChild(document.createTextNode(item.suffix));
    item.el.textContent = "";
    item.el.appendChild(wrap);
  }
  function run(item, delay) {
    prime(item);
    if (item.state !== "primed") return;
    item.state = "running";
    setTimeout(function () {
      var start = null;
      function frame(now) {
        if (start === null) start = now;
        var t = Math.min((now - start) / DURATION, 1);
        var eased = 1 - Math.pow(1 - t, 3);
        item.value.textContent = format(item, item.target * eased);
        if (t < 1) { window.requestAnimationFrame(frame); return; }
        item.el.innerHTML = item.html;
        item.el.removeAttribute("aria-label");
        item.state = "done";
      }
      window.requestAnimationFrame(frame);
    }, delay);
  }
  function find(el) { for (var i = 0; i < items.length; i++) if (items[i].el === el) return items[i]; return null; }
  var primer = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (e.isIntersecting) { var it = find(e.target); if (it) prime(it); primer.unobserve(e.target); }
    });
  }, { threshold: 0 });
  var starter = new IntersectionObserver(function (entries) {
    var batch = 0;
    entries.forEach(function (e) {
      if (!e.isIntersecting) return;
      var it = find(e.target);
      if (it) run(it, batch++ * STAGGER);
      starter.unobserve(e.target);
    });
  }, { threshold: 0.4 });
  items.forEach(function (it) { primer.observe(it.el); starter.observe(it.el); });
})(root);
})();
</script>

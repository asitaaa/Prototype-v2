bel=\"About this home\">\n<div class=\"property-layout gap-40\">\n<div class=\"flex-column gap-40\">\n<ul class=\"key-facts gap-12\">\n<li class=\"bg-light-2 rounded-m pad-20 flex-column gap-4\"><span class=\"title-4 use-heading-font heading-on-light\">3</span><span class=\"body-s detail-on-light\">Bedrooms</span></li>\n<li class=\"bg-light-2 rounded-m pad-20 flex-column gap-4\"><span class=\"title-4 use-heading-font heading-on-light\">2</span><span class=\"body-s detail-on-light\">Bathrooms</span></li>\n<li class=\"bg-light-2 rounded-m pad-20 flex-column gap-4\"><span class=\"title-4 use-heading-font heading-on-light\">1,750</span><span class=\"body-s detail-on-light\">Square feet</span></li>\n<li class=\"bg-light-2 rounded-m pad-20 flex-column gap-4\"><span class=\"title-4 use-heading-font heading-on-light\">Ranch</span><span class=\"body-s detail-on-light\">Single-story home</span></li>\n</ul>\n<div class=\"flex-column gap-20\">\n<h2 class=\"title-4 heading-on-light\">A single-story ranch on one of Cypress's quiet streets</h2>\n<p class=\"body-l body-on-light\">Sample copy for the prototype. A bright three-bedroom ranch home with an open kitchen, a living room that looks out over a deep backyard, and a two-car garage.</p>\n<p class=\"body-m body-on-light\">The house sits on a calm, tree-lined block near Moody Street and Orange Avenue, with the parks, schools and shops of central Cypress a few minutes away. Daniel will walk you through what's been updated and what a buyer might want to change.</p>\n</div>\n<div class=\"flex-column gap-20\">\n<h2 class=\"title-5 heading-on-light\">Inside and out</h2>\n<ul class=\"feature-list gap-12 body-m body-on-light\">\n<li>Open kitchen with dining area</li>\n<li>Backyard with patio</li>\n<li>Two-car attached garage</li>\n<li>Central air and heating</li>\n<li>Laundry inside the home</li>\n<li>Primary bedroom with its own bath</li>\n</ul>\n</div>\n<figure class=\"bg-light-2 rounded-l pad-32 flex-column gap-20\">\n<p class=\"sub-title subtitle-on-light\">Daniel on this street</p>\n<blockquote class=\"title-5 use-heading-font heading-on-light\"><p>\"Blocks like this one rarely come up. People move in with young kids and stay until the kids have kids. Ask me about the walk to Oak Knoll Park.\"</p></blockquote>\n<figcaption class=\"flex-row flex-align-center gap-12\">\n<img class=\"avatar-s\" src=\"https://images.unsplash.com/photo-1591818873794-ba8279c7da8a?auto=format&fit=crop&w=96&q=75&h=96\" alt=\"\">\n<span class=\"body-s detail-on-light\">Daniel Reyes, senior agent for Cypress, La Palma and Buena Park</span>\n</figcaption>\n</figure>\n<div class=\"flex-column gap-20\">\n<h2 class=\"title-5 heading-on-light\">Around the house</h2>\n<ul class=\"feature-list gap-12 body-m body-on-light\">\n<li>Oak Knoll Park</li>\n<li>Cypress College</li>\n<li>Cypress School District elementary schools</li>\n<li>Shops and restaurants on Lincoln Avenue</li>\n</ul>\n</div>\n<div class=\"flex-column gap-20\">\n<h2 class=\"title-5 heading-on-light\">Floor plan</h2>\n<figure class=\"bg-light-2 rounded-l pad-24 flex-column gap-16\">\n<div class=\"plan-frame\">\n<svg class=\"plan-svg\" viewBox=\"0 0 780 560\" role=\"img\" aria-labelledby=\"plan-title plan-desc\">\n<title id=\"plan-title\">Floor plan, Orange Avenue Ranch</title>\n<desc id=\"plan-desc\">Single-story plan. Bedrooms and baths on the left: primary bedroom with its own bath and closet, bedroom 2 and bedroom 3. A hall connects the entry, laundry and second bath. Open kitchen and dining at the back facing the patio, living room at the front, attached two-car garage on the right.</desc>\n<rect class=\"plan-outdoor\" x=\"310\" y=\"40\" width=\"220\" height=\"100\" rx=\"4\"/>\n<text class=\"plan-label-muted\" x=\"420\" y=\"95\" text-anchor=\"middle\">Patio</text>\n<rect class=\"plan-garage\" x=\"530\" y=\"280\" width=\"220\" height=\"220\"/>\n<text class=\"plan-label\" x=\"640.0\" y=\"386.0\" text-anchor=\"middle\">Two-car garage</text>\n<text class=\"plan-d
